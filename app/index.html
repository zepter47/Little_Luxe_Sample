<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=brown-bear" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#79543f" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa/apple-touch-icon.png" />
    <title>Little Luxe</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the original URL after GitHub Pages serves our 404 redirect.
      const route = new URLSearchParams(location.search).get('__pages_route');
      if (route && route.startsWith('/') && !route.startsWith('//')) {
        history.replaceState(null, '', route + location.hash);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
